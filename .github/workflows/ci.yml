name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Type-check server and web
        run: npm run typecheck

      - name: Server tests (node --test) and web tests (Vitest)
        run: npm test

      - name: Production build of the web client
        run: npm run build
